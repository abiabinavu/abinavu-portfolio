<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Certificate details for Abinavu M." />
  <title>Certificate | Abinavu M</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#101512;--paper:#f4f2eb;--lime:#b8ff37;--line:#28312a;--muted:#687168}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font-family:"Plus Jakarta Sans",sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto;padding:30px 0 64px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand,.back,.pager a{color:var(--paper);text-decoration:none;font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.08em}.brand b{color:var(--lime)}.back,.pager a{border:1px solid #596158;padding:12px 16px}.back:hover,.pager a:hover{border-color:var(--lime);color:var(--lime)}.eyebrow{font:12px "DM Mono",monospace;color:var(--lime);letter-spacing:.1em;margin:64px 0 16px}h1{font:clamp(34px,6vw,76px)/.98 Syne,sans-serif;letter-spacing:-.06em;margin:0;max-width:850px}.details{display:grid;grid-template-columns:1fr 1.7fr;gap:28px;margin-top:44px}.meta{border:1px solid var(--line);padding:28px;height:max-content}.meta p{color:var(--muted);font-size:13px;margin:0 0 9px}.meta strong{display:block;margin-bottom:28px;font:600 18px Syne,sans-serif}.certificate-frame{background:#080b09;border:1px solid var(--line);padding:16px}.certificate-frame img{width:100%;max-height:76vh;object-fit:contain;display:block}.pager{display:flex;justify-content:space-between;gap:14px;margin-top:24px}.pager a:last-child{margin-left:auto}@media(max-width:720px){.wrap{width:min(100% - 28px,1180px)}.top{gap:18px}.details{grid-template-columns:1fr;margin-top:28px}.eyebrow{margin-top:38px}.meta{padding:20px}.certificate-frame{padding:8px}.pager{flex-wrap:wrap}.pager a:last-child{margin-left:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><a class="brand" href="index.html">ABINAVU<b>.M</b></a><a class="back" href="index.html#certificates">← ALL CERTIFICATES</a></header>
    <p class="eyebrow">CERTIFICATION / <span id="number"></span></p>
    <h1 id="title"></h1>
    <section class="details"><aside class="meta" id="meta"></aside><div class="certificate-frame"><img id="certificate" alt="Certificate awarded to Abinavu M" /></div></section><nav class="pager" aria-label="Certificate navigation"><a id="previous" href="#">← PREVIOUS</a><a href="index.html#certificates">ALL CERTIFICATES</a><a id="next" href="#">NEXT →</a></nav>
  </main>
  <script>
    const certificates={
      embedded:{number:"01",title:"Introduction to Embedded System Design",issuer:"NPTEL Online Certification",recognition:"Elite certification — 62%",period:"Jan–Apr 2026 · 12-week course",image:"embedded-systems-certificate.png"},
      semiconductor:{number:"02",title:"Introduction to Semiconductor Devices",issuer:"NPTEL Online Certification",recognition:"Elite certification — 67%",period:"Jul–Oct 2025 · 12-week course",image:"semiconductor-devices-certificate.jpeg"},
      scout:{number:"03",title:"Rajya Puraskar Scout Certificate",issuer:"The Bharat Scouts and Guides",recognition:"Rajya Puraskar",period:"Awarded 12 January 2025",image:"scout-certificate.jpeg"}
    };
    const keys=Object.keys(certificates); const key=new URLSearchParams(location.search).get("cert"); const active=keys.includes(key)?key:keys[0]; const cert=certificates[active];
    document.title=`${cert.title} | Abinavu M`; document.querySelector('#number').textContent=cert.number; document.querySelector('#title').textContent=cert.title;
    document.querySelector('#certificate').src=cert.image; document.querySelector('#certificate').alt=`${cert.title} certificate awarded to Abinavu M`;
    document.querySelector('#meta').innerHTML=`<p>ISSUED BY</p><strong>${cert.issuer}</strong><p>RECOGNITION</p><strong>${cert.recognition}</strong><p>COURSE / AWARD</p><strong>${cert.period}</strong>`;
    const position=keys.indexOf(active); document.querySelector('#previous').href=`certificate.html?cert=${keys[(position-1+keys.length)%keys.length]}`; document.querySelector('#next').href=`certificate.html?cert=${keys[(position+1)%keys.length]}`;
  </script>
</body>
</html>
